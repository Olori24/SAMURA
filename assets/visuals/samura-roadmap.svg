<text x="586" y="210" class="k" fill="#f0ce7c">03 / CONVERSATIONAL AI</text><text x="586" y="238" class="name">Provider integration</text><text x="586" y="262" class="body">Prove live streaming, cancellation,</text><text x="586" y="280" class="body">errors, and bounded usage.</text>
<rect x="586" y="291" width="184" height="17" rx="8" fill="#51421e"/><text x="678" y="303" text-anchor="middle" class="status" fill="#ffe7a1">LIVE TEST PENDING</text>
