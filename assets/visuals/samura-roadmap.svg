<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">SAMURA development roadmap</title>
<desc id="desc">A staged roadmap: foundation code and CI verified; live identity and database verification in progress; conversational provider integration awaiting live test; then planned memory, bounded agents, evaluation, model research, and production hardening.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110e"/><stop offset="1" stop-color="#111b18"/></linearGradient>
<style>
.k{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.7px;fill:#78e9b9}.head{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#f2faf6}.name{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#eff8f3}.body{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#b7c9c0}.status{font:700 10px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1px}
</style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="42" y="46" class="k">SAMURA / DELIVERY SEQUENCE</text>
<text x="42" y="80" class="head">From reliable foundation to independent research.</text>
<text x="42" y="105" class="body">Milestones advance only when their acceptance criteria are demonstrated.</text>
<path d="M88 157 H1112" stroke="#35483f" stroke-width="3"/>
<path d="M88 157 H330" stroke="#2dc68a" stroke-width="3"/>
<g>
