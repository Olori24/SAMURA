<text x="846" y="210" class="k" fill="#b5c2ff">04 / CONTEXT</text><text x="846" y="238" class="name">Memory</text><text x="846" y="262" class="body">User control,</text><text x="846" y="280" class="body">continuity, deletion.</text>
<rect x="846" y="291" width="116" height="17" rx="8" fill="#283151"/><text x="904" y="303" text-anchor="middle" class="status" fill="#cbd4ff">PLANNED</text>
