<rect x="38" y="183" width="252" height="132" rx="14" fill="#10251b" stroke="#2d6b4d"/>
<text x="58" y="210" class="k">01 / FOUNDATION</text><text x="58" y="238" class="name">App + CI baseline</text><text x="58" y="262" class="body">Install, audit, typecheck, lint,</text><text x="58" y="280" class="body">unit tests, production build.</text>
<rect x="58" y="291" width="148" height="17" rx="8" fill="#1c573b"/><text x="132" y="303" text-anchor="middle" class="status" fill="#a3f3cd">CI VERIFIED</text>
</g>
<g>
<circle cx="330" cy="157" r="9" fill="#e2b75b" stroke="#ffebb0" stroke-width="2"/>
<rect x="302" y="183" width="252" height="132" rx="14" fill="#272214" stroke="#806d37"/>
<text x="322" y="210" class="k" fill="#f0ce7c">02 / LIVE VERIFICATION</text><text x="322" y="238" class="name">Identity + persistence</text><text x="322" y="262" class="body">Migrate test DB; verify signup,</text><text x="322" y="280" class="body">sessions, ownership, stored chat.</text>
<rect x="322" y="291" width="184" height="17" rx="8" fill="#51421e"/><text x="414" y="303" text-anchor="middle" class="status" fill="#ffe7a1">RELEASE GATE OPEN</text>
