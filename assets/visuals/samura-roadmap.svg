<text x="1010" y="210" class="k" fill="#b5c2ff">05–08 / SCALE</text><text x="1010" y="238" class="name">Agents → research</text><text x="1010" y="262" class="body">Tools, evaluations,</text><text x="1010" y="280" class="body">model experiments,</text><text x="1010" y="298" class="body">production hardening.</text>
</g>
<rect x="38" y="348" width="1124" height="158" rx="16" fill="#0c1713" stroke="#263c32"/>
<text x="62" y="378" class="k">MILESTONE EXIT RULES</text>
<g class="body">
<circle cx="66" cy="410" r="3" fill="#74e6b5"/><text x="80" y="414">No database milestone without a successful migration and real persistence test.</text>
<circle cx="66" cy="439" r="3" fill="#74e6b5"/><text x="80" y="443">No AI milestone without an authorized live provider response and failure-path tests.</text>
<circle cx="66" cy="468" r="3" fill="#74e6b5"/><text x="80" y="472">No agent milestone without permission checks, timeouts, auditability, and verified outcomes.</text>
<circle cx="650" cy="410" r="3" fill="#a5b2ff"/><text x="664" y="414">No model research claim without reproducible evidence, provenance, and resource estimates.</text>
<circle cx="650" cy="439" r="3" fill="#a5b2ff"/><text x="664" y="443">No production-ready label until operational and security release gates are closed.</text>
</g>
<text x="62" y="490" class="status" fill="#70897c">SOURCE OF TRUTH: docs/ROADMAP.md</text>
</svg>