<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
  <title id="title">SAMURA AI</title>
  <desc id="desc">Original SAMURA mark: a luminous emerald orbital monogram beside the SAMURA wordmark and the phrase Building Toward Independent Intelligence.</desc>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73f5c2"/>
      <stop offset="1" stop-color="#13b981"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f1b"/>
      <stop offset="1" stop-color="#070c0b"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="718" height="188" rx="26" fill="url(#field)" stroke="#274139"/>
  <g transform="translate(34 30)">
    <rect width="130" height="130" rx="30" fill="#0e1c17" stroke="#2a5444"/>
    <circle cx="65" cy="65" r="43" fill="none" stroke="url(#emerald)" stroke-width="2.5" opacity=".85"/>
    <ellipse cx="65" cy="65" rx="21" ry="43" fill="none" stroke="#8ef8cf" stroke-width="1.8" transform="rotate(42 65 65)" opacity=".8"/>
    <path d="M38 82 L38 48 L65 76 L92 48 L92 82" fill="none" stroke="url(#emerald)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="24" r="4" fill="#b4ffe0"/>
  </g>
  <text x="192" y="88" fill="#f3fbf7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="47" font-weight="750" letter-spacing="8">SAMURA</text>
  <text x="195" y="119" fill="#7fe8bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="5">ARTIFICIAL INTELLIGENCE</text>
  <path d="M195 139 H660" stroke="#28463b" stroke-width="1"/>
  <text x="195" y="160" fill="#b4c9bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="1.3">BUILDING TOWARD INDEPENDENT INTELLIGENCE</text>
</svg>