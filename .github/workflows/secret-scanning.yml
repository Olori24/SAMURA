name: Secret Scanning

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout all history and refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all reachable refs with redacted output
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: git --log-opts="--all --full-history" --redact --verbose --exit-code 1
