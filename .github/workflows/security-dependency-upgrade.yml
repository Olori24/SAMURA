name: Validate security dependency upgrade

on:
  push:
    branches:
      - "security/openai-zod-major-upgrade"

permissions:
  contents: write

jobs:
  lock-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/openai-zod-major-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: regenerate lockfile for OpenAI 7 and Zod 4"
            git push origin HEAD:security/openai-zod-major-upgrade
          fi
      - name: Install exact lockfile
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
