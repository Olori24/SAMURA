name: SAMURA CI

on:
  push:
    branches: [main, "feat/**", "docs/**"]
  pull_request:
    branches: [main, "feat/**"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and repair the dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || true
      - name: Export regenerated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: samura-posthog-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Commit regenerated lockfile to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          cp package-lock.json /tmp/samura-package-lock.generated.json
          git fetch --no-tags origin "${PR_BRANCH}"
          git checkout -B lockfile-refresh FETCH_HEAD
          cp /tmp/samura-package-lock.generated.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh dependency lockfile"
            git push origin "HEAD:${PR_BRANCH}"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > /tmp/samura-npm-audit.json || true
          node -e 'const a=require("/tmp/samura-npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range,url:x.url})}))},null,2))'
      - name: Enforce dependency security audit
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
