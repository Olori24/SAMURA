name: Patch vulnerable dependencies

on:
  push:
    branches:
      - chore/privacy-legal-risk-reduction
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: samura-dependency-remediation
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: chore/privacy-legal-risk-reduction
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade patched dependencies and regenerate lockfile
        run: npm install --save-exact next@16.4.3 zod@4.6.7
      - name: Enforce dependency security audit
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git stash push -u -m "verified dependency remediation"
            git fetch origin chore/privacy-legal-risk-reduction
            git rebase origin/chore/privacy-legal-risk-reduction
            git stash pop
            git add package.json package-lock.json
            git commit -m "security(deps): patch Next.js and Zod advisories"
            git push origin HEAD:chore/privacy-legal-risk-reduction
          fi
      - name: Dispatch final CI against updated branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"chore/privacy-legal-risk-reduction"}'
