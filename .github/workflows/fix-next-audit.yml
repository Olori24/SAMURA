name: Apply non-breaking npm security fixes

on:
  push:
    branches:
      - feature/sentry-monitoring
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/fix-next-audit.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sentry-monitoring
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply non-breaking security updates
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No non-breaking lockfile updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: apply non-breaking npm audit fixes"
          git push origin HEAD:feature/sentry-monitoring
