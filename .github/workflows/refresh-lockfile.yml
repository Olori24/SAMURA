name: Refresh npm lockfile

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths: ["package.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: samura-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and dispatch validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f package-lock.json ] && { ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 || ! git diff --quiet -- package-lock.json; }; then
            git add package-lock.json
            git commit -m "build: commit deterministic npm lockfile"
            git push origin "HEAD:$BRANCH"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref="$BRANCH"
          fi
